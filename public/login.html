<style>
  :root { --blue:#6b6e70; --bg:#f2f2f2; --border:#d4d5d6; --txt:#1a1a2e; --muted:#6b7280; }
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    background: var(--bg);
    font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .logo {
    height: 64px;
    width: auto;
    margin-bottom: 22px;
  }
  h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--blue);
    margin-bottom: 6px;
  }
  p.sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
  }
  button {
    width: 100%;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.15s;
  }
  button:hover { background: #55585a; }
  button:disabled { opacity: 0.6; cursor: default; }
  #msg {
    margin-top: 16px;
    font-size: 12.5px;
    color: #dc2626;
    min-height: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/axis-logo.png" alt="Axis Services Group">
    <h1 id="appTitle"></h1>
    <p class="sub">Sign in with your Axis account to continue</p>
    <button id="signInBtn" onclick="signIn()">Sign in with Microsoft</button>
    <p id="msg"></p>
  </div>

  <script>
    const msalApp = new msal.PublicClientApplication({
      auth: {
        clientId: "7485bf02-3fbf-478b-a4d0-05ddcc3b1c1e",
        authority: "https://login.microsoftonline.com/e52a9a87-78f1-4048-b915-d974ad3d98ac",
        redirectUri: window.location.origin
      },
      cache: { cacheLocation: "localStorage" }
    });

    async function signIn() {
      const btn = document.getElementById('signInBtn');
      const msg = document.getElementById('msg');
      msg.textContent = '';
      btn.disabled = true;
      try {
        if (!msalApp.getAllAccounts().length) {
          await msalApp.loginPopup({ scopes: ["User.Read"] });
        }
        window.location.href = "/index.html";
      } catch (e) {
        msg.textContent = "Sign-in failed: " + e.message;
        btn.disabled = false;
      }
    }

    document.getElementById('appTitle').textContent = APP_NAME;
    document.title = "Sign In — " + APP_NAME;

    window.onload = () => {
      if (msalApp.getAllAccounts().length) {
        window.location.href = "/index.html";
      }
    };
  </script>
</body>
</html>
